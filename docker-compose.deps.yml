services:
  postgres:
    image: postgres:16-alpine
    container_name: mediapulse-postgres
    environment:
      POSTGRES_USER: mediapulse
      POSTGRES_PASSWORD: mediapulse_secret
      POSTGRES_DB: mediapulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediapulse -d mediapulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediapulse-redis
    ports:
      - "6379:6379"