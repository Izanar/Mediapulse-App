name: CI / Lint, Build, Test and Push to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_WORKER: ${{ github.repository }}/worker

jobs:
  # 1. Job: Статический анализ кода (Linter)
  lint:
    name: Lint & Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linter Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          # Остановка пайплайна при синтаксических ошибках (E9, F63, F7, F82)
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Предупреждения по стилю кода
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # 2. Job: Тестирование Compose-стека и сборка/пуш образов в GHCR
  build-and-push:
    name: Build, Test & Push Docker Images
    needs: lint  # Выполняется только если lint завершился без ошибок
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create .env file for CI
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
            echo "POSTGRES_USER=mediapulse" >> .env
            echo "POSTGRES_PASSWORD=mediapulse_secret" >> .env
            echo "POSTGRES_DB=mediapulse" >> .env
            echo "REDIS_PORT=6379" >> .env
          fi

      # Проверка работоспособности приложения в Docker Compose
      - name: Validate Docker Compose Stack
        run: |
          docker compose up -d --build
          sleep 10
          docker compose ps

      - name: Check API Health Endpoint
        run: curl --fail http://localhost:8000/health || exit 1

      - name: Down Compose
        if: always()
        run: docker compose down -v

      # Сборка и отправка API в GHCR
      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Сборка и отправка Worker в GHCR
      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
